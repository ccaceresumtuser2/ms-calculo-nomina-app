#Nombre de la aplicación. Aparece en logs y métricas, y lo usan herramientas como Eureka o Config Server.
spring.application.name=ms-calculo-nomina
#Archivos de mensajes (sin .properties), separados por coma: messages.properties y swagger.properties
spring.messages.basename=messages,swagger
#URL base del grupo de clientes empleados. Toda interfaz @HttpExchange de ese grupo llamará a http://localhost:8091/...
#spring.http.serviceclient.empleados.base-url=http://localhost:8091
spring.http.serviceclient.empleados.base-url=https://appempleado.onrender.com
#Tiempo máximo para establecer la conexión. Si el servidor no acepta en 2 s, falla.
spring.http.clients.connect-timeout=2s
#Tiempo máximo esperando la respuesta una vez conectado.
spring.http.clients.read-timeout=5s
#Activa los virtual threads de Java 21+. Cada petición corre en un hilo virtual muy ligero, en lugar de usar el pool limitado de Tomcat.
spring.threads.virtual.enabled=true
#Puerto donde escucha tu microservicio.
server.port=8080

# ===== Retry: reintentos cortos ===== Si la llamada falla, la vuelve a intentar automáticamente. a nivel de peticion
#3 intentos, 30 segundos de espera entre cada intento, con backoff exponencial
resilience4j.retry.instances.empleados.max-attempts=3    
#espera 5 segundos entre cada intento, con backoff exponencial
resilience4j.retry.instances.empleados.wait-duration=2000ms
#cada espera se duplica
resilience4j.retry.instances.empleados.enable-exponential-backoff=true
resilience4j.retry.instances.empleados.exponential-backoff-multiplier=2
#En lugar de esperar siempre el mismo tiempo exacto, cada espera se elige al azar dentro de un rango.
resilience4j.retry.instances.empleados.enable-randomized-wait=true
#Con wait-duration=500ms y factor 0.5:
#Define el tamaño de ese rango. 0.5 significa ±50 % del tiempo base.
#500ms - 50% = 250ms
#500ms + 50% = 750ms
# la espera será un valor aleatorio entre 250 ms y 750 ms
resilience4j.retry.instances.empleados.randomized-wait-factor=0.5
#solo reintenta si se lanza esa excepción concreta. Cualquier otro error falla de inmediato.
#ServicioNoDisponibleException	Tu propia excepción. Probablemente la lanzas cuando el servicio responde 503 o algo similar.
#java.io.IOException	Errores de red: conexión rechazada, conexión cortada, timeout de socket.
#java.util.concurrent.TimeoutException	Timeouts en código asíncrono (CompletableFuture, @TimeLimiter).
resilience4j.retry.instances.empleados.retry-exceptions=\
  com.emp.nomina.app.exception.ServicioNoDisponibleException,\
  java.io.IOException,\
  java.util.concurrent.TimeoutException
# ===== Circuit Breaker ===== a nivel de todas las periciones
#Funciona como el breaker eléctrico de una casa. Si el servicio falla demasiado, 
#“corta” y deja de llamarlo durante un tiempo, para no insistir sobre algo caído.
#Muestra el estado del circuito (CLOSED, OPEN, HALF_OPEN) en /actuator/health.
resilience4j.circuitbreaker.instances.empleados.register-health-indicator=true
#COUNT_BASED (por cantidad de llamadas) ->La ventana son las últimas N llamadas, sin importar cuándo ocurrieron. N es el valor de sliding-window-size
#TIME_BASED (por tiempo)->La ventana son las llamadas que ocurrieron en los últimos N segundos, sin importar cuántas fueron. N es el valor de sliding-window-size
resilience4j.circuitbreaker.instances.empleados.sliding-window-type=TIME_BASED
#Con TIME_BASED, son 60 segundos: siempre mira el último minuto.
resilience4j.circuitbreaker.instances.empleados.sliding-window-size=60
#No calcula porcentajes hasta tener al menos 10 llamadas en la ventana. Evita abrir el circuito por 1 fallo de 2 llamadas (50 %).
resilience4j.circuitbreaker.instances.empleados.minimum-number-of-calls=10
#Si el 50% de las últimas 10 llamadas fallan, abre el breaker y deja de llamar al servicio durante 30 segundos.
resilience4j.circuitbreaker.instances.empleados.slow-call-duration-threshold=2s
#Si el 50 % o más de las llamadas son lentas, también se abre.
resilience4j.circuitbreaker.instances.empleados.failure-rate-threshold=50
#mientras está abierto, todas las llamadas se rechazan al instante (lanza CallNotPermittedException o va al fallback). Este estado dura 30 segundos.
resilience4j.circuitbreaker.instances.empleados.wait-duration-in-open-state=10s
#Si el circuito se reabre, la espera crece en lugar de ser siempre igual.
resilience4j.circuitbreaker.instances.empleados.enable-exponential-backoff=true
#Cada reapertura duplica la espera: 10 s → 20 s → 40 s → 80 s…
resilience4j.circuitbreaker.instances.empleados.exponential-backoff-multiplier=2
#…hasta un máximo de 2 minutos.
resilience4j.circuitbreaker.instances.empleados.exponential-max-wait-duration-in-open-state=120s
#En semiabierto deja pasar 3 llamadas de prueba.
resilience4j.circuitbreaker.instances.empleados.permitted-number-of-calls-in-half-open-state=3
#Pasa a semiabierto cuando termina la espera, sin necesidad de que llegue una petición.
resilience4j.circuitbreaker.instances.empleados.automatic-transition-from-open-to-half-open-enabled=true
#Solo estas excepciones cuentan como fallo. Las demás se tratan como éxito.
resilience4j.circuitbreaker.instances.empleados.record-exceptions=\
  com.emp.nomina.app.exception.ServicioNoDisponibleException,\
  java.io.IOException,\
  java.util.concurrent.TimeoutException

# ===== Bulkhead (reemplaza a @ConcurrencyLimit) =====
#Este es el Bulkhead. Limita cuántas llamadas al servicio de empleados pueden estar en curso al mismo tiempo.

#como máximo 1000 llamadas simultáneas. Funciona como un estacionamiento con 1000 plazas: cada llamada ocupa una plaza mientras dura y la libera al terminar.
resilience4j.bulkhead.instances.empleados.max-concurrent-calls=1000
#si las 1000 plazas están ocupadas, la llamada nueva espera hasta 500 ms a que se libere una. Si no lo consigue, se rechaza con BulkheadFullException (o va al fallback).
resilience4j.bulkhead.instances.empleados.max-wait-duration=500ms

# ===== Rate Limiter: maximo 100 llamadas por segundo =====
#Este es el Rate Limiter. Limita cuántas llamadas se permiten por unidad de tiempo.

#se permiten 100 llamadas por periodo.
resilience4j.ratelimiter.instances.empleados.limit-for-period=100
#el periodo dura 1 segundo. Al empezar cada segundo, el contador se reinicia a 100 permisos.
resilience4j.ratelimiter.instances.empleados.limit-refresh-period=1s
#si se acabaron los permisos, la llamada se rechaza al instante con RequestNotPermitted (o va al fallback). No espera al siguiente segundo.
resilience4j.ratelimiter.instances.empleados.timeout-duration=0

# ===== Actuator =====
#Publica estos dos endpoints por HTTP:

#/actuator/health: la salud general de la aplicación.
#/actuator/circuitbreakers: lista todos los circuit breakers con su estado y métricas.
management.endpoints.web.exposure.include=health,circuitbreakers
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always

logging.charset.console=UTF-8
logging.charset.file=UTF-8